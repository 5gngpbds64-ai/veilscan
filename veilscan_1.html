<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VeilScan Explorer</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0A0A0C; --surface:#141417; --surface-2:#1C1C21; --surface-3:#26262C;
    --line:#232328; --line-strong:#2E2E35;
    --text:#F5F5F7; --muted:#8B8B93; --muted-2:#5F5F68;
    --accent:#8B7CF6; --accent-dim:rgba(139,124,246,0.14);
    --green:#3ECF8E; --green-dim:rgba(62,207,142,0.14);
    --red:#F2545B; --red-dim:rgba(242,84,91,0.14);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 20px 80px; }

  header{ border-bottom:1px solid var(--line); padding:18px 0; margin-bottom:28px; }
  .header-row{ max-width:900px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:9px; background:linear-gradient(150deg, var(--accent), #6C5CE0);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#0A0A0C; flex-shrink:0;
  }
  .brand-name{ font-size:17px; font-weight:800; letter-spacing:-0.3px; }
  .brand-tag{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:12px; padding:10px 14px; flex:1; min-width:220px; max-width:420px;
  }
  .search-box input{
    background:none; border:none; outline:none; color:var(--text); font-size:13px; flex:1;
    font-family:monospace;
  }
  .search-box input::placeholder{ color:var(--muted-2); font-family:-apple-system,sans-serif; }
  .search-box svg{ color:var(--muted); flex-shrink:0; }

  .section-title{ font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:14px; }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; margin-right:6px; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

  .tx-list{ display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:16px; overflow:hidden; border:1px solid var(--line); }
  .tx-row{
    display:flex; align-items:center; gap:14px; background:var(--surface); padding:14px 18px; cursor:pointer;
    transition:background .12s ease;
  }
  .tx-row:hover{ background:var(--surface-2); }
  .tx-icon{ width:36px; height:36px; border-radius:10px; overflow:hidden; flex-shrink:0; }
  .tx-icon svg{ width:100%; height:100%; display:block; }
  .tx-main{ flex:1; min-width:0; }
  .tx-title{ font-size:13.5px; font-weight:600; color:var(--text); }
  .tx-hash-preview{ font-size:11.5px; color:var(--muted-2); font-family:monospace; margin-top:2px; }
  .tx-amt{ text-align:right; flex-shrink:0; }
  .tx-amt-val{ font-size:13px; font-weight:700; }
  .tx-amt-val.up{ color:var(--green); }
  .tx-amt-val.down{ color:var(--text); }
  .tx-time{ font-size:11px; color:var(--muted); margin-top:2px; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px; }
  .empty-state svg{ margin-bottom:14px; opacity:0.5; }

  /* Detail view */
  #detail-view{ display:none; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:600; margin-bottom:20px; cursor:pointer; }
  .back-link:hover{ color:var(--text); }
  .scan-action-card{ display:flex; align-items:center; gap:14px; background:var(--surface); border-radius:16px; padding:20px; margin-bottom:16px; }
  .scan-action-icon{ width:44px; height:44px; border-radius:12px; overflow:hidden; flex-shrink:0; }
  .scan-action-icon svg{ width:100%; height:100%; display:block; }
  .scan-action-label{ font-size:10.5px; font-weight:700; letter-spacing:0.6px; color:var(--muted); text-transform:uppercase; }
  .scan-action-desc{ font-size:15px; font-weight:700; color:var(--text); margin-top:4px; }
  .scan-card{ background:var(--surface); border-radius:16px; padding:4px 20px; margin-bottom:16px; }
  .scan-row{ padding:15px 0; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .scan-row:last-child{ border-bottom:none; }
  .scan-row-label{ font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.4px; flex-shrink:0; padding-top:2px; }
  .scan-row-value{ font-size:13.5px; color:var(--text); font-weight:600; text-align:right; }
  .scan-hash{ font-family:monospace; font-size:12.5px; color:var(--text); word-break:break-all; text-align:right; }
  .scan-status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; color:var(--green);
    background:var(--green-dim); padding:4px 10px; border-radius:20px;
  }
  .footnote{ text-align:center; font-size:11.5px; color:var(--muted-2); margin-top:28px; line-height:1.6; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">V</div>
      <div>
        <div class="brand-name">VeilScan</div>
        <div class="brand-tag">The public ledger for Veil Wallet</div>
      </div>
    </div>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Search by transaction hash" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </div>
</header>

<div class="wrap">
  <div id="list-view">
    <div class="section-title"><span class="live-dot"></span>Live Transactions</div>
    <div class="tx-list" id="tx-list"></div>
  </div>

  <div id="detail-view">
    <div class="back-link" onclick="showList()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Back to transactions
    </div>
    <div class="scan-action-card">
      <div class="scan-action-icon" id="d-tx-logo"></div>
      <div>
        <div class="scan-action-label">Transaction Action</div>
        <div class="scan-action-desc" id="d-tx-heading">—</div>
      </div>
    </div>
    <div class="scan-card">
      <div class="scan-row">
        <span class="scan-row-label">Transaction Hash</span>
        <span class="scan-hash" id="d-tx-hash">—</span>
      </div>
      <div class="scan-row">
        <span class="scan-row-label">Status</span>
        <span class="scan-status-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Success
        </span>
      </div>
      <div class="scan-row"><span class="scan-row-label">Block</span><span class="scan-row-value" id="d-tx-block">—</span></div>
      <div class="scan-row"><span class="scan-row-label">Timestamp</span><span class="scan-row-value" id="d-tx-date">—</span></div>
    </div>
    <div class="scan-card">
      <div class="scan-row"><span class="scan-row-label" id="d-tx-cp-label">From</span><span class="scan-hash" id="d-tx-cp">—</span></div>
      <div class="scan-row"><span class="scan-row-label">Value</span><span class="scan-row-value" id="d-tx-value">—</span></div>
      <div class="scan-row"><span class="scan-row-label">Transaction Fee</span><span class="scan-row-value" id="d-tx-fee">—</span></div>
      <div class="scan-row"><span class="scan-row-label">Gas Price</span><span class="scan-row-value" id="d-tx-gas">—</span></div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, limit, onSnapshot, where, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC-Hx86meaXo-lptSSuij5cnKi-DUXRSBs",
    authDomain: "veil-99263.firebaseapp.com",
    projectId: "veil-99263",
    storageBucket: "veil-99263.firebasestorage.app",
    messagingSenderId: "410710513338",
    appId: "1:410710513338:web:b2df379d940c68a92c1483"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  /* ---------- Deterministic fake block/gas metadata (same algorithm as the wallet app) ---------- */
  function hashSeed(str){
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    };
  }
  function coinIconSVG(coinColor, ticker){
    return `<svg viewBox="0 0 40 40" width="100%" height="100%"><rect width="40" height="40" rx="12" fill="${coinColor}"/><text x="20.5" y="27" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="16" font-weight="800" fill="#fff">${(ticker||'?').charAt(0)}</text></svg>`;
  }
  function shortHash(h){ return h ? (h.length<=14 ? h : h.slice(0,8)+'…'+h.slice(-6)) : '—'; }
  function fmtAmount(n){ return Number(n).toLocaleString(undefined, { maximumFractionDigits: 6 }); }
  function fmtUsd(n){
    const sign = n<0?'-':''; const abs = Math.abs(n);
    const parts = abs.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return sign+'$'+parts[0]+'.'+parts[1];
  }
  function relativeTime(ts){
    const s = Math.floor((Date.now()-ts)/1000);
    if(s<60) return s+'s ago';
    if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago';
    return Math.floor(s/86400)+'d ago';
  }

  let lastRenderedList = [];

  function renderTxRow(tx, idx){
    const isIn = tx.type==='Received' || tx.type==='Bought' || tx.type==='Swapped';
    const sign = isIn ? '+' : '-';
    return `
      <div class="tx-row" data-idx="${idx}">
        <div class="tx-icon">${coinIconSVG(tx.coinColor, tx.coinTicker)}</div>
        <div class="tx-main">
          <div class="tx-title">${tx.type} ${tx.coinTicker}</div>
          <div class="tx-hash-preview">${shortHash(tx.txId)}</div>
        </div>
        <div class="tx-amt">
          <div class="tx-amt-val ${isIn?'up':'down'}">${sign}${fmtAmount(tx.amount)} ${tx.coinTicker}</div>
          <div class="tx-time">${relativeTime(tx.clientTs)}</div>
        </div>
      </div>`;
  }

  function renderList(txs){
    const list = document.getElementById('tx-list');
    lastRenderedList = txs;
    if(!txs.length){
      list.innerHTML = `<div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <div>No transactions yet. Once someone sends, receives, buys, or swaps in Veil, it'll show up here in real time.</div>
      </div>`;
      return;
    }
    list.innerHTML = txs.map((tx,i)=>renderTxRow(tx,i)).join('');
  }

  // Single delegated click listener - avoids ever embedding transaction data
  // as inline HTML attribute text, which breaks the moment a value contains
  // a literal quote character (every JSON payload does).
  document.getElementById('tx-list').addEventListener('click', (e) => {
    const row = e.target.closest('.tx-row');
    if(!row) return;
    const idx = parseInt(row.dataset.idx, 10);
    const tx = lastRenderedList[idx];
    if(tx) window.showDetail(JSON.stringify(tx));
  });

  /* ---------- Live simulated activity (client-side only - never written to
     the real database, purely so the feed looks active). Merged in with
     genuine transactions on every render, newest first, capped at 100. ---------- */
  const SIM_COINS = [
    { id:'btc', name:'Bitcoin', ticker:'BTC', color:'#F7931A', price:64150 },
    { id:'eth', name:'Ethereum', ticker:'ETH', color:'#627EEA', price:1858 },
    { id:'sol', name:'Solana', ticker:'SOL', color:'#000000', price:74.20 },
    { id:'doge', name:'Dogecoin', ticker:'DOGE', color:'#C2A633', price:0.0693 },
    { id:'ltc', name:'Litecoin', ticker:'LTC', color:'#345D9D', price:46.80 },
    { id:'xrp', name:'XRP', ticker:'XRP', color:'#23292F', price:1.10 },
    { id:'xmr', name:'Monero', ticker:'XMR', color:'#FF6600', price:351.10 },
    { id:'ada', name:'Cardano', ticker:'ADA', color:'#0033AD', price:0.163 },
    { id:'avax', name:'Avalanche', ticker:'AVAX', color:'#E84142', price:123.62 },
  ];
  const SIM_TYPES = ['Bought', 'Sent', 'Received', 'Swapped'];
  function simAddress(){
    const chars = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    return Array.from({length:34}, ()=> chars[Math.floor(Math.random()*chars.length)]).join('');
  }
  function simTxId(){
    const chars = '0123456789abcdef';
    return Array.from({length:16}, ()=> chars[Math.floor(Math.random()*16)]).join('');
  }
  function randomUsdValue(){
    // Log-uniform across $0.01–$75,000 so small transactions are common
    // and large ones are rare, like a real distribution would look.
    const min = 0.01, max = 75000;
    return Math.exp(Math.random() * Math.log(max/min)) * min;
  }
  function generateFakeTx(){
    const coin = SIM_COINS[Math.floor(Math.random()*SIM_COINS.length)];
    const type = SIM_TYPES[Math.floor(Math.random()*SIM_TYPES.length)];
    const usdValue = randomUsdValue();
    const amount = usdValue / coin.price;
    const tx = {
      txId: simTxId(),
      type, coinId: coin.id, coinName: coin.name, coinTicker: coin.ticker, coinColor: coin.color,
      amount, priceUsd: coin.price,
      accountAddress: simAddress(), accountName: null,
      clientTs: Date.now(),
      _sim: true,
    };
    if(type === 'Sent' || type === 'Received'){
      tx.counterparty = simAddress();
    } else if(type === 'Swapped'){
      const otherCoin = SIM_COINS[Math.floor(Math.random()*SIM_COINS.length)];
      const otherAmt = (usdValue / otherCoin.price);
      tx.counterparty = `${fmtAmount(otherAmt)} ${otherCoin.ticker}`;
    } else {
      tx.counterparty = null;
    }
    return tx;
  }

  let realTxs = [];
  let simTxs = [];
  const MAX_TOTAL = 100;

  function renderCombined(){
    const combined = simTxs.concat(realTxs)
      .sort((a,b) => b.clientTs - a.clientTs)
      .slice(0, MAX_TOTAL);
    renderList(combined);
  }

  setInterval(() => {
    simTxs.unshift(generateFakeTx());
    if(simTxs.length > MAX_TOTAL) simTxs.length = MAX_TOTAL;
    renderCombined();
  }, 3000);
  // Seed a handful immediately so the page doesn't look empty on first load.
  for(let i=0; i<8; i++){
    const tx = generateFakeTx();
    tx.clientTs = Date.now() - i*45000;
    simTxs.push(tx);
  }
  renderCombined();

  const q = query(collection(db, 'transactions'), orderBy('clientTs', 'desc'), limit(50));
  onSnapshot(q, (snap) => {
    realTxs = snap.docs.map(d => d.data());
    renderCombined();
  }, (err) => {
    console.error('Live transactions unavailable:', err.code || err.message);
  });

  window.showDetail = function(txJson){
    const tx = JSON.parse(txJson);
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';

    document.getElementById('d-tx-logo').innerHTML = coinIconSVG(tx.coinColor, tx.coinTicker);
    document.getElementById('d-tx-heading').textContent =
      `${tx.type} ${fmtAmount(tx.amount)} ${tx.coinTicker} (${fmtUsd(tx.amount*tx.priceUsd)})`;
    document.getElementById('d-tx-hash').textContent = tx.txId ? '0x'+tx.txId : '—';

    const seed = hashSeed('scanmeta-'+(tx.txId||'x'));
    const blockNum = 18000000 + Math.floor(seed()*9999999);
    document.getElementById('d-tx-block').textContent = blockNum.toLocaleString();

    const d = new Date(tx.clientTs);
    document.getElementById('d-tx-date').textContent =
      `${relativeTime(tx.clientTs)} | ${d.toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})}`;

    const cpLabel = document.getElementById('d-tx-cp-label');
    const cpVal = document.getElementById('d-tx-cp');
    if(tx.type === 'Bought'){ cpLabel.textContent = 'Method'; cpVal.textContent = 'Instant Buy'; }
    else if(tx.type === 'Sent'){ cpLabel.textContent = 'To Address'; cpVal.textContent = tx.counterparty || 'Unknown'; }
    else if(tx.type === 'Received'){ cpLabel.textContent = 'From Address'; cpVal.textContent = tx.counterparty || 'Unknown'; }
    else if(tx.type === 'Swapped'){ cpLabel.textContent = 'Swapped From'; cpVal.textContent = tx.counterparty || '—'; }
    else { cpLabel.textContent = 'Counterparty'; cpVal.textContent = tx.counterparty || 'External'; }

    document.getElementById('d-tx-value').textContent = `${fmtAmount(tx.amount)} ${tx.coinTicker} (${fmtUsd(tx.amount*tx.priceUsd)})`;

    const feeUsd = 0.5 * (0.7 + seed()*0.6);
    document.getElementById('d-tx-fee').textContent = `${(feeUsd/tx.priceUsd).toFixed(6)} ${tx.coinTicker} (${fmtUsd(feeUsd)})`;
    document.getElementById('d-tx-gas').textContent = `${(0.4+seed()*2.5).toFixed(2)} Gwei`;

    history.replaceState(null, '', '?tx=' + encodeURIComponent(tx.txId));
  };

  window.showList = function(){
    document.getElementById('detail-view').style.display = 'none';
    document.getElementById('list-view').style.display = 'block';
    history.replaceState(null, '', location.pathname);
  };

  // Support deep links: veilchain.html?tx=abc123...
  async function checkDeepLink(){
    const params = new URLSearchParams(location.search);
    const txId = params.get('tx');
    if(!txId) return;
    try{
      const q2 = query(collection(db, 'transactions'), where('txId', '==', txId), limit(1));
      const snap = await getDocs(q2);
      if(!snap.empty){
        window.showDetail(JSON.stringify(snap.docs[0].data()));
      }
    }catch(e){ /* ignore, just show the list */ }
  }
  checkDeepLink();

  // Search by hash
  document.getElementById('search-input').addEventListener('keydown', async (e) => {
    if(e.key !== 'Enter') return;
    const val = e.target.value.trim().replace(/^0x/, '');
    if(!val) return;
    try{
      const q3 = query(collection(db, 'transactions'), where('txId', '==', val), limit(1));
      const snap = await getDocs(q3);
      if(!snap.empty){
        window.showDetail(JSON.stringify(snap.docs[0].data()));
      } else {
        alert('No transaction found with that hash.');
      }
    }catch(err){
      alert('Search failed: ' + (err.code || err.message));
    }
  });
</script>
</body>
</html>
